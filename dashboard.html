/* WINTURBO_REDESIGN_V20_CSS */
:root{--bg:#070a08;--panel:#101611;--panel2:#0c120e;--line:#233027;--text:#f5f7f5;--muted:#8fa097;--green:#42e36c;--orange:#ff9d2e;--red:#ff6666;--blue:#67b7ff;--shadow:0 16px 42px rgba(0,0,0,.22)}
body{background:radial-gradient(circle at 72% -15%,rgba(66,227,108,.08),transparent 32%),var(--bg)}
.shell{grid-template-columns:272px minmax(0,1fr)}
.sidebar{background:rgba(9,13,10,.96);backdrop-filter:blur(14px);padding:24px 18px;border-right:1px solid #1c271f;z-index:5}
.sidebar .brand{font-size:25px;letter-spacing:-.04em}.sidebar>.muted{margin-top:2px}
.nav{gap:7px;margin-top:24px}.nav button{display:flex;align-items:center;gap:8px;padding:12px 13px;border-radius:12px;font-weight:750;transition:.18s ease}.nav button:hover{background:#111a13;color:#fff}.nav button.on{background:linear-gradient(90deg,rgba(66,227,108,.16),rgba(66,227,108,.05));border-color:rgba(66,227,108,.26);color:#dfffe6;box-shadow:inset 3px 0 0 var(--green)}
.main{padding:24px clamp(18px,3vw,42px) 56px;max-width:1680px;width:100%;margin:0 auto}
.topbar{position:sticky;top:0;z-index:4;padding:12px 0 15px;background:linear-gradient(180deg,var(--bg) 72%,rgba(7,10,8,0));margin-bottom:10px}.topbar h1{font-size:clamp(24px,2.3vw,34px);letter-spacing:-.04em}.toolbar{gap:9px}.toolbar select,.toolbar button{min-height:42px}
.card{border-color:#202d24;border-radius:16px;background:linear-gradient(180deg,rgba(18,26,20,.98),rgba(13,19,15,.98));box-shadow:var(--shadow)}

<script>/* WINTURBO_BONUS_REFRESH_V71 */
(function(){
  const REFRESH_INTERVAL=15*60*1000;
  let refreshPromise=null;
  let refreshTimer=null;
  let lastRefresh=0;
  const button=()=>document.getElementById('refreshBonusV66');
  const message=()=>document.getElementById('bonusMessageV66');

  function showStatus(text,isError){
    const host=message();
    if(!host)return;
    host.textContent=text;
    host.style.color=isError?'#ff9b73':'';
  }

  function ensureScheduleLabel(){
    const refreshButton=button();
    if(!refreshButton||document.getElementById('bonusRefreshScheduleV71'))return;
    const label=document.createElement('span');
    label.id='bonusRefreshScheduleV71';
    label.className='muted small';
    label.style.alignSelf='center';
    label.textContent='Auto refresh: every 15 minutes';
    refreshButton.insertAdjacentElement('afterend',label);
  }

  async function verifyDataAccess(){
    if(typeof sb==='undefined')throw new Error('Database connection is not ready.');
    const [links,recommendations]=await Promise.all([
      sb.from('bonus_intelligence_links').select('id',{count:'exact',head:true}),
      sb.from('bonus_recommendations').select('recommendation_key',{count:'exact',head:true}).like('recommendation_key','winturbo%')
    ]);
    if(links.error)throw links.error;
    if(recommendations.error)throw recommendations.error;
  }

  function refreshBonus(reason){
    if(refreshPromise)return refreshPromise;
    const refreshButton=button();
    const originalLabel=refreshButton?.textContent||'Refresh';
    if(refreshButton){
      refreshButton.disabled=true;
      refreshButton.textContent='Refreshing…';
      refreshButton.setAttribute('aria-busy','true');
    }
    showStatus(reason==='auto'?'Auto-refreshing Bonus Intelligence…':'Refreshing Bonus Intelligence…',false);
    refreshPromise=Promise.resolve()
      .then(async()=>{
        if(typeof window.WinTurboBonusIntelligence!=='function')throw new Error('Bonus Intelligence is still loading. Please try again.');
        await verifyDataAccess();
        await window.WinTurboBonusIntelligence();
      })
      .then(()=>{
        lastRefresh=Date.now();
        const updated=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date(lastRefresh));
        const next=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date(lastRefresh+REFRESH_INTERVAL));
        showStatus('Updated at '+updated+' · Next automatic refresh at '+next+'.',false);
        const label=document.getElementById('bonusRefreshScheduleV71');
        if(label)label.textContent='Auto refresh: every 15 minutes · Last '+updated;
      })
      .catch(error=>{
        showStatus('Refresh failed: '+(error?.message||String(error)),true);
        throw error;
      })
      .finally(()=>{
        if(refreshButton){
          refreshButton.disabled=false;
          refreshButton.textContent=originalLabel;
          refreshButton.removeAttribute('aria-busy');
        }
        refreshPromise=null;
      });
    return refreshPromise;
  }

  function bindRefreshButton(){
    const refreshButton=button();
    if(!refreshButton||refreshButton.dataset.refreshV71)return;
    refreshButton.dataset.refreshV71='true';
    refreshButton.type='button';
    refreshButton.addEventListener('click',event=>{
      event.preventDefault();
      event.stopImmediatePropagation();
      event.stopPropagation();
      refreshBonus('manual').catch(()=>{});
    },true);
    ensureScheduleLabel();
  }

  function startAutoRefresh(){
    bindRefreshButton();
    if(refreshTimer)return;
    refreshTimer=window.setInterval(()=>{
      if(document.visibilityState==='visible')refreshBonus('auto').catch(()=>{});
    },REFRESH_INTERVAL);
  }

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&lastRefresh&&Date.now()-lastRefresh>=REFRESH_INTERVAL){
      refreshBonus('auto').catch(()=>{});
    }
  });
  document.addEventListener('click',event=>{
    if(event.target.closest('#loginBtn'))window.setTimeout(startAutoRefresh,1100);
  });
  new MutationObserver(bindRefreshButton).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('load',()=>window.setTimeout(startAutoRefresh,850));
  window.WinTurboRefreshBonus=refreshBonus;
})();
</script>

        const mostActive=[...activity.values()].sort((a,b)=>b.count-a.count||b.views-a.views)[0];
        const strongestFormat=[...formats.values()].sort((a,b)=>(b.views/Math.max(1,b.count))-(a.views/Math.max(1,a.count)))[0];
        const formatMix=[...formats.values()].sort((a,b)=>b.count-a.count).map(x=>x.type+' '+Math.round(x.count/Math.max(1,posts.length)*100)+'%').slice(0,4).join(' · ');

<script>/* WINTURBO_COMPACT_SEARCHABLE_NAV_V81 */
