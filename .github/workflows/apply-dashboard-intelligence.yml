name: Apply WinTurbo dashboard intelligence patch

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-intelligence.yml'
      - 'patch_dashboard_intelligence.py'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python patch_dashboard_intelligence.py
      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
          else
            git commit -m "Refresh evidence-based dashboard analytics"
            git push
          fi
