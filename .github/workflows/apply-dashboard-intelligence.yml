name: Apply WinTurbo dashboard intelligence patch

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-intelligence.yml'
      - 'patch_dashboard_intelligence.py'
      - 'patch_dashboard_v3.py'
      - 'patch_dashboard_overview_v4.py'
      - 'patch_dashboard_sources_v5.py'
      - 'patch_dashboard_telegram_publish_v6.py'
      - 'patch_dashboard_content_ideas_v7.py'
      - 'patch_dashboard_higgsfield_v8.py'
      - 'patch_dashboard_dedupe_v9.py'
      - 'patch_dashboard_content_runtime_v10.py'
      - 'patch_dashboard_content_autogen_v11.py'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch base dashboard intelligence
        run: python patch_dashboard_intelligence.py
      - name: Patch growth and AI intelligence
        run: python patch_dashboard_v3.py
      - name: Patch executive overview analytics
        run: python patch_dashboard_overview_v4.py
      - name: Patch source-aware dashboard experience
        run: python patch_dashboard_sources_v5.py
      - name: Patch Telegram publishing controls
        run: python patch_dashboard_telegram_publish_v6.py
      - name: Patch Verification and Content Ideas
        run: python patch_dashboard_content_ideas_v7.py
      - name: Patch direct Higgsfield generation
        run: python patch_dashboard_higgsfield_v8.py
      - name: Remove duplicate dashboard sections
        run: python patch_dashboard_dedupe_v9.py
      - name: Repair Content Ideas runtime
        run: python patch_dashboard_content_runtime_v10.py
      - name: Automate Content Ideas creative generation
        run: python patch_dashboard_content_autogen_v11.py
      - name: Upload generated dashboard
        uses: actions/upload-artifact@v4
        with:
          name: generated-dashboard
          path: dashboard.html
      - name: Commit dashboard update
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
          else
            git commit -m "Automate Content Ideas media generation and ready-to-post preview"
            git push
          fi
