<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create WinTurbo Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080b09;color:#f4f7f5;font:14px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,92%);background:#111812;border:1px solid #263229;border-radius:22px;padding:28px}.brand{font-size:28px;font-weight:900}.win{color:#42e36c}.turbo{color:#ff9d2e}.muted{color:#8fa097}label{display:block;margin-top:12px;margin-bottom:5px;color:#8fa097}input{width:100%;box-sizing:border-box;padding:12px;background:#0a0f0c;border:1px solid #263229;border-radius:10px;color:#fff}.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#42e36c;color:#071009;font-weight:800;cursor:pointer}.link{display:block;margin-top:14px;color:#42e36c;text-decoration:none}.msg{margin-top:12px}.ok{color:#8df2a3}.err{color:#ff9696}</style></head><body><div class="box"><div class="brand"><span class="win">WIN</span><span class="turbo">TURBO</span></div><p class="muted">Create your dashboard account</p><label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Password</label><input id="pass" type="password" placeholder="Minimum 6 characters"><label>Confirm password</label><input id="confirmPass" type="password" placeholder="Re-enter password"><button id="signupBtn" class="btn">Create account</button><div id="msg" class="msg muted"></div><a class="link" href="./dashboard.html">Already have an account? Log in</a></div><script>const sb=supabase.createClient('https://kxspsqtdvngiovjvskuq.supabase.co','sb_publishable_mY0ClcO6rmkXBE9ppsX5ew_IFQ4jvD8');signupBtn.onclick=async()=>{msg.className='msg muted';msg.textContent='Creating account…';const e=email.value.trim(),p=pass.value,c=confirmPass.value;if(!e||!p){msg.className='msg err';msg.textContent='Enter email and password.';return}if(p.length<6){msg.className='msg err';msg.textContent='Password must be at least 6 characters.';return}if(p!==c){msg.className='msg err';msg.textContent='Passwords do not match.';return}signupBtn.disabled=true;const{data,error}=await sb.auth.signUp({email:e,password:p});signupBtn.disabled=false;if(error){msg.className='msg err';msg.textContent=error.message;return}if(data.session){location.href='./dashboard.html'}else{msg.className='msg ok';msg.textContent='Account created. Check your email to confirm your address, then log in.'}};</script></body></html>
